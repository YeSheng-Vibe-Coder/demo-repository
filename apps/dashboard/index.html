<!doctype html>
<html lang="zh-CN" data-theme="day">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AML·AGENT 可解释的反洗钱调查</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+SC:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/dashboard/static/styles.css?v=13">
</head>
<body class="shell">
  <aside class="side">
    <div class="side-brand"><b>AML·AGENT</b><small data-en="Explainable AML investigation">可解释的反洗钱调查</small></div>
    <nav class="side-nav">
      <button class="tab" data-view="rules"><svg viewBox="0 0 24 24"><path d="M6 3v12M18 9a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM6 21a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM18 9a9 9 0 0 1-9 9"/></svg><span data-en="Rules">规则</span></button>
      <button class="tab on" data-view="trace"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><path d="M12 12l6-6"/></svg><span data-en="Alert tracing">告警追查</span></button>
      <button class="tab" data-view="evolution"><svg viewBox="0 0 24 24"><path d="M12 3l1.9 5.6L19.5 10l-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.4z"/></svg><span data-en="Rule evolution">规则进化</span></button>
    </nav>
    <div class="side-scope" id="side-scope"></div>
    <div class="side-foot">
      <div class="side-toggles"><button id="lang" class="side-theme">EN</button><button id="theme" class="side-theme">☾</button></div>
      <span id="cycle-id"></span>
    </div>
  </aside>

  <main class="main">
    <!-- 告警追查 -->
    <section class="view on" id="view-trace">
      <div class="page-head">
        <div><h2 data-en="Alert tracing">告警追查</h2><p data-en="Investigated alerts of the validation period; click a row for hit rules, network and the investigation replay">验证期全部告警；点击一行查看命中规则、关系网与调查回放</p></div>
        <button class="btn-solid" id="live-open"><i>⚡</i><span data-en="Investigate now">立刻调查</span></button>
      </div>
      <div class="t-kpis" id="t-kpis"></div>
      <div class="t-filters" id="t-filters"></div>
      <div class="t-table" id="t-table"></div>
    </section>

    <!-- 规则进化 -->
    <section class="view" id="view-evolution">
      <div class="page-head"><div><h2 data-en="Rule evolution">规则进化</h2><p data-en="How an alert becomes evidence, and how evidence makes three agents more precise">一条告警如何变成证据，证据如何让三个 agent 越来越准</p></div></div>
      <div class="evo-loop" id="evo-loop"></div>
      <div class="evo-row"><div class="evo-panel" id="evo-tier"></div><div class="evo-panel" id="evo-inv"></div></div>
      <div class="evo-panel" id="evo-chain"></div>
      <div class="card history" id="history">
        <div class="card-head"><div><h3 data-en="Rule versions">规则版本记录</h3><small data-en="Every training or update creates a version; click one to switch the rules and tree above">每次训练或更新生成一个版本；点击版本切换上方的规则与决策树</small></div></div>
        <div class="timeline-v" id="versions"></div>
        <div class="v-body"><div id="version-detail" class="version-detail"></div><div id="rule-diff" class="rule-diff"></div></div>
      </div>
    </section>

    <!-- 规则 -->
    <section class="view" id="view-rules">
      <div class="page-head">
        <div><h2><span data-en="Rule library">规则库</span> <span class="vtag" id="current-version"></span></h2>
          <p data-en="An alert fires when any rule holds · features are materialised per day in Zetaris; fitting and validation run in-database, raw transactions never leave">任一规则成立即告警 · 指标在 Zetaris 中按天物化，规则拟合与验证评估都在库内计算，原始交易不出库</p></div>
        <button class="btn-ghost" id="toggle-history" data-en="Version history">查看版本记录</button>
      </div>
      <div id="rule-summary" class="r-kpis"></div>
      <div class="rules-grid">
        <div class="card tree-block">
          <div class="card-head"><div><h3 data-en="Decision tree">决策树</h3><small data-en="Fitted on development labels · green leaves are rules; click a rule to highlight its path">开发集标签上拟合 · 绿色是规则叶子，点击规则高亮路径</small></div><span class="icon-btn" title="全屏">⤢</span></div>
          <div class="tree-wrap"><svg id="tree"></svg></div>
          <div class="note" id="tree-note"></div>
        </div>
        <div class="rule-col">
          <div class="card-head plain"><div><h3 data-en="Rules">规则</h3><small data-en="Any rule raises an alert; all conditions within a rule must hold">任一规则成立即告警；规则内所有条件同时成立</small></div>
            <div class="seg" id="rule-sort"><button data-sort="windows" class="on" data-en="By volume">按命中量</button><button data-sort="precision" data-en="By precision">按准确率</button></div></div>
          <div id="rule-list"></div>
        </div>
      </div>
    </section>
  </main>

  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer"></aside>
  <div id="modal" class="modal"><div class="modal-card" id="modal-card"></div></div>
  <div id="tooltip" class="tooltip"></div>
  <script src="/dashboard/static/i18n.js?v=13"></script>
  <script src="/dashboard/static/views.js?v=13"></script>
  <script src="/dashboard/static/app.js?v=13"></script>
</body>
</html>
